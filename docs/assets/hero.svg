<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Real-time Visual Identification System">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0e17"/><stop offset="1" stop-color="#241c30"/></linearGradient>
    <linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#ec4899"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#8b5cf6" stroke-opacity=".12"/></pattern>
    <clipPath id="face"><rect x="90" y="50" width="200" height="200" rx="12"/></clipPath>
  </defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/><rect width="900" height="300" rx="18" fill="url(#grid)"/>
  <g clip-path="url(#face)">
    <ellipse cx="190" cy="140" rx="52" ry="68" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <g fill="#14b8a6"><circle cx="170" cy="125" r="4"/><circle cx="210" cy="125" r="4"/><circle cx="190" cy="148" r="4"/><circle cx="174" cy="172" r="4"/><circle cx="206" cy="172" r="4"/>
      <animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></g>
    <rect x="90" y="50" width="200" height="3" fill="#ec4899" opacity=".9"><animate attributeName="y" values="50;247;50" dur="3s" repeatCount="indefinite"/></rect>
  </g>
  <g fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round">
    <path d="M90 80V50H120"/><path d="M260 50H290V80"/><path d="M90 220V250H120"/><path d="M260 250H290V220"/>
    <animate attributeName="stroke-opacity" values="1;.4;1" dur="1.6s" repeatCount="indefinite"/>
  </g>
  <text x="330" y="125" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="800" fill="url(#tx)">Real-time Visual</text>
  <text x="330" y="170" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="800" fill="url(#tx)">Identification System</text>
  <text x="330" y="205" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#94a3b8">Phone as CCTV · AI on the laptop · instant missing-person alerts</text>
  <rect x="330" y="225" width="176" height="28" rx="14" fill="#14b8a6" fill-opacity=".15" stroke="#14b8a6"/>
  <circle cx="348" cy="239" r="5" fill="#14b8a6"><animate attributeName="r" values="4;7;4" dur="1.4s" repeatCount="indefinite"/></circle>
  <text x="362" y="244" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#14b8a6">MATCH CONFIRMED · 3/5</text>
</svg>
